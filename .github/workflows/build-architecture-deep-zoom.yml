name: Build deep-zoom architecture assets

on:
  push:
    branches: [architecture-deep-zoom]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source package
        run: python tools/architecture-deep-zoom/bootstrap_assets.py
      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y inkscape
      - name: Generate and validate
        run: |
          python tools/architecture-deep-zoom/generate.py architecture-deep-zoom.svg
          tools/architecture-deep-zoom/render_previews.sh
          python tools/architecture-deep-zoom/validate.py \
            --preview-dir docs/architecture-deep-zoom/previews \
            --render-dir /tmp/tusk-architecture-validation \
            --json docs/architecture-deep-zoom/validation-report.json
          find architecture-deep-zoom.svg docs/architecture-deep-zoom tools/architecture-deep-zoom \
            -type f ! -path '*/bootstrap/*' ! -name bootstrap_assets.py ! -name SHA256SUMS \
            -print0 | sort -z | xargs -0 sha256sum > docs/architecture-deep-zoom/SHA256SUMS
      - name: Remove bootstrap transport
        run: rm -rf tools/architecture-deep-zoom/bootstrap tools/architecture-deep-zoom/bootstrap_assets.py
      - name: Commit generated package
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add architecture-deep-zoom.svg docs/architecture-deep-zoom tools/architecture-deep-zoom
          git commit -m "Add source-recovered deep-zoom architecture" || exit 0
          git push
