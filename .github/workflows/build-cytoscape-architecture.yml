name: Build Cytoscape architecture artifacts

on:
  push:
    branches:
      - architecture/cytoscape-semantic-zoom
    paths:
      - docs/diagrams/cytoscape-semantic-zoom/payload/READY

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Fetch pinned Cytoscape.js
        run: |
          curl --fail --location --retry 3 \
            https://cdn.jsdelivr.net/npm/cytoscape@3.33.1/dist/cytoscape.min.js \
            --output docs/diagrams/cytoscape-semantic-zoom/payload/cytoscape.min.js

      - name: Assemble standalone HTML
        run: python docs/diagrams/cytoscape-semantic-zoom/assemble.py

      - name: Install browser renderer
        run: |
          python -m pip install playwright==1.54.0
          python -m playwright install --with-deps chromium

      - name: Render focused preview
        run: python docs/diagrams/cytoscape-semantic-zoom/render_preview.py

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/diagrams/cytoscape-semantic-zoom/tusk-cytoscape-architecture.html \
            docs/diagrams/cytoscape-semantic-zoom/tusk-arch-agent-orchestrator.png
          if git diff --cached --quiet; then
            echo "Generated artifacts are unchanged."
            exit 0
          fi
          git commit -m "Generate Cytoscape architecture artifacts"
          git push
