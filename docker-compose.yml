services:
  tusk:
    build: .
    # Run as the host user so the X server (SI:localuser) and the D-Bus session
    # bus (owned by uid 1000) authorize the tray; as root both reject it.
    user: "1000:1000"
    env_file:
      - .env
    environment:
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /root/.Xauthority
      # GTK (via pystray appindicator) loads the ATK->AT-SPI bridge at init; there
      # is no accessibility bus in the container, so it prints a dbind-WARNING.
      # Nothing consumes a11y here, so skip the bridge entirely.
      NO_AT_BRIDGE: "1"
      HOME: /tmp
      # pystray writes the tray icon to a tempfile and hands the PATH to the
      # host's panel over D-Bus; point tempfile at the shared mount so the host
      # can actually read it (otherwise it falls back to a generic icon).
      TMPDIR: /tmp/tusk
      PULSE_SERVER: unix:/run/user/1000/pulse/native
      # Route only TUSK through the host's WebRTC echo-canceller (see
      # docker/pipewire-echo-cancel.conf) so it stops hearing its own TTS.
      # libpulse applies these when a client opens the default device, which
      # both paplay (TTS) and PortAudio capture do. Override via .env to bypass
      # echo cancellation or target a different device.
      PULSE_SINK: ${PULSE_SINK:-echo-cancel-sink}
      PULSE_SOURCE: ${PULSE_SOURCE:-echo-cancel-source}
      PYTHONUNBUFFERED: "1"
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
      SHOW_LOGS: ${SHOW_LOGS:-}
      # OTLP endpoint for Arize Phoenix traces; set TRACING_OTLP_ENDPOINT= (empty)
      # in .env to disable tracing — the no-colon form keeps an empty value empty.
      TRACING_OTLP_ENDPOINT: ${TRACING_OTLP_ENDPOINT-http://phoenix:6006/v1/traces}
      # Container-local codex home; entrypoint writes config.toml + copies auth here.
      CODEX_HOME: /tmp/.codex
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY:-~/.Xauthority}:/root/.Xauthority:ro
      - /run/user/1000/pulse/native:/run/user/1000/pulse/native
      - ~/.cache/whisper:/root/.cache/whisper
      - /run/user/1000/bus:/run/user/1000/bus
      - /usr/share/applications:/usr/share/applications:ro
      - ~/.local/share/applications:/home-apps:ro
      - /var/lib/snapd/desktop/applications:/snap-apps:ro
      - /tmp/tusk:/tmp/tusk
      # Codex backend: host OAuth tokens, copied into the container-local CODEX_HOME
      # by the entrypoint (keeps the host's ~/.codex/config.toml untouched).
      - ~/.codex:/host-codex:ro
      - .:/app
    devices:
      - /dev/snd:/dev/snd
    tty: true
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:17.25.0
    ports:
      - "6006:6006"
    volumes:
      - phoenix-data:/mnt/data
    restart: unless-stopped

volumes:
  phoenix-data:
