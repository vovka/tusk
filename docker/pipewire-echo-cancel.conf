# WebRTC echo cancellation for TUSK: subtracts TUSK's own TTS out of the mic
# so it stops hearing itself. Exposes virtual "echo-cancel-source/sink"; pin the
# real mic/speaker as targets so setting the virtual nodes default can't loop.
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      capture.props = {
        target.object = "alsa_input.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__hw_sofhdadsp_6__source"
        node.passive = true
      }
      source.props = {
        node.name = "echo-cancel-source"
        node.description = "Echo-Cancelled Mic (TUSK)"
        media.class = "Audio/Source"
      }
      playback.props = {
        target.object = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__hw_sofhdadsp__sink"
        node.passive = true
      }
      sink.props = {
        node.name = "echo-cancel-sink"
        node.description = "Echo-Cancelled Speaker (TUSK)"
        media.class = "Audio/Sink"
      }
    }
  }
]
