# WebRTC echo cancellation for TUSK: subtracts TUSK's own TTS out of the mic
# so it stops hearing itself. Exposes virtual "echo-cancel-source/sink"; pin the
# real mic/speaker as targets so setting the virtual nodes default can't loop.
#
# YOUR_ALSA_INPUT_SOURCE / YOUR_ALSA_OUTPUT_SINK are placeholders — replace with
# your machine's real node names from `wpctl status` (see docs/features/
# mic-echo-cancellation.md for the full setup steps).
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      capture.props = {
        target.object = "YOUR_ALSA_INPUT_SOURCE"
        node.passive = true
      }
      source.props = {
        node.name = "echo-cancel-source"
        node.description = "Echo-Cancelled Mic (TUSK)"
        media.class = "Audio/Source"
      }
      playback.props = {
        target.object = "YOUR_ALSA_OUTPUT_SINK"
        node.passive = true
      }
      sink.props = {
        node.name = "echo-cancel-sink"
        node.description = "Echo-Cancelled Speaker (TUSK)"
        media.class = "Audio/Sink"
      }
    }
  }
]
